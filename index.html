<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turon tarixi: Temuriylardan Shayboniylargacha</title>
<style>
:root{color-scheme:dark;--gold:#e8c26a;--ink:#f4efe3;--card:rgba(12,16,32,.62);--line:rgba(232,194,106,.32);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:#0b1020;color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.65}
#bg{position:fixed;inset:-30px;background-size:cover;background-position:center;filter:blur(8px) saturate(1.1);z-index:-2}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(8,10,22,.5),rgba(8,10,22,.85));z-index:-1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 20px;background:rgba(8,10,22,.7);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header a.logo{color:var(--gold);font-weight:bold;text-decoration:none;margin-right:auto;letter-spacing:.05em}
header a{color:var(--ink);text-decoration:none;font-size:14px}header a:hover{color:var(--gold)}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px 60px}
.hero{min-height:62vh;display:flex;flex-direction:column;justify-content:center}
h1,h2,h3{font-weight:normal;color:var(--gold);line-height:1.2}
h1{font-size:clamp(32px,7vw,64px);margin:.2em 0}h2{font-size:clamp(24px,4vw,36px);margin:1.6em 0 .5em}
.tag{color:var(--gold);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.btn{display:inline-block;margin-top:14px;padding:10px 22px;background:var(--gold);color:#1a1405;border-radius:24px;text-decoration:none;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(3px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
a.pc{display:block;color:var(--ink);text-decoration:none;transition:transform .2s}
a.pc:hover{transform:translateY(-4px);border-color:var(--gold)}
.av{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--gold);color:#1a1405;font-size:24px;margin-bottom:8px}
.pc b{font-size:18px;display:block}.pc small{color:var(--gold)}
.tl{border-left:2px solid var(--gold);margin-left:8px;padding-left:20px}
.tl div{position:relative;margin-bottom:14px}.tl div:before{content:'';position:absolute;left:-28px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.tl b{color:var(--gold)}
ul{padding-left:1.1em}li{margin:.4em 0}
.q{border-left:3px solid var(--gold);padding:6px 16px;font-style:italic;margin:18px 0}
.q span{display:block;font-style:normal;color:var(--gold);font-size:13px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.facts div{flex:1 1 140px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(232,194,106,.08)}
.facts small{display:block;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.chip{display:inline-block;margin:4px 6px 0 0;padding:4px 12px;border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;font-size:14px}
.chip:hover{background:var(--gold);color:#1a1405}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
footer{text-align:center;padding:24px;font-size:13px;opacity:.7}
.page{display:none}.page.on{display:block;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style></head><body>
<div id="bg"></div><div class="shade"></div>
<header><a class="logo" href="#home">◈ TURON TARIXI</a><a href="#home">Bosh sahifa</a><a href="#shaxslar">Shaxslar</a><a href="#mavzular">Mavzular</a></header>
<div class="wrap"><div id="app"></div></div>
<footer>XV–XVI asrlar Turon tarixi · darslik materiallari asosida</footer>
<script>
function scene(t,c){
 const C={a:['#1c2f66','#e8a24a','#0e1a3d'],b:['#3b2a1a','#d98a3d','#1a120a'],c:['#14343a','#e0c070','#0a1c20'],d:['#3a1a2e','#e08a5a','#1a0c18']}[c];
 let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+C[0]+'"/><stop offset="1" stop-color="'+C[1]+'"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/><circle cx="620" cy="190" r="60" fill="#fff3c4" opacity=".75"/>';
 if(t=='a')s+='<g fill="'+C[2]+'"><rect y="400" width="800" height="100"/><rect x="250" y="270" width="300" height="130"/><path d="M290 270a110 110 0 0 1 220 0z"/><rect x="270" y="150" width="14" height="250"/><rect x="516" y="150" width="14" height="250"/><path d="M262 150h30l-15-40zM508 150h30l-15-40z"/><rect x="90" y="320" width="120" height="80"/><path d="M100 320a50 50 0 0 1 100 0z"/><rect x="600" y="330" width="120" height="70"/><path d="M610 330a50 50 0 0 1 100 0z"/></g>';
 else if(t=='s')s+='<path d="M0 360Q200 290 400 350T800 330V500H0z" fill="'+C[2]+'" opacity=".7"/><path d="M0 420Q250 370 500 420T800 400V500H0z" fill="'+C[2]+'"/><g fill="'+C[2]+'"><path d="M120 400a45 40 0 0 1 90 0z"/><path d="M260 410a35 32 0 0 1 70 0z"/><path d="M560 405a45 40 0 0 1 90 0z"/></g>';
 else s+='<path d="M0 400L120 250L220 340L360 180L500 340L620 230L800 400V500H0z" fill="'+C[2]+'" opacity=".75"/><path d="M0 440Q200 400 400 450T800 430V500H0z" fill="'+C[2]+'"/>';
 return 'url("data:image/svg+xml,'+encodeURIComponent(s+'</svg>')+'")';
}
const P={
abulxayr:{n:'Abulxayrxon',a:'A',y:'1412–1468',r:'O‘zbek ulusi xoni',bg:['s','b'],f:[['Tug‘ilgan','1412'],['Poytaxt','Tura, so‘ng Sig‘noq'],['Xon bo‘ldi','1428']],t:'Erta yetim qolgan Abulxayr Jumadulxon xizmatida dasht kurashlarida qatnashdi. 16 yoshida asir tushdi, ammo mang‘it beylari qarori bilan ozod bo‘ldi. 1428-yil Turada xon deb e’lon qilindi, saylovda sultonlar, bahodirlar va ulamolar qatnashdi.',l:['1430-yil Xorazmni egallab, “Ulug‘ xon” unvonini oldi.','1446-yil Sig‘noq, Oqqo‘rg‘on, Arquq va O‘zgan shaharlarini oldi, poytaxtni Sig‘noqqa ko‘chirdi.','Temuriy shahzodalar kurashiga aralashib, Abu Saidni Samarqand taxtiga o‘tqazdi.','Ulug‘bekning qizi Robiya Sultonga uylandi; o‘g‘li Ko‘chkunchixo‘ja keyinchalik Buxoroni boshqardi.','Raqiblari Girayxon va Jonibekxon Yettisuvga ketib, 1465–66-yillarda Qozoq xonligiga asos soldilar.'],q:['Xonni saylashda sultonlar, qabila rahnamolari va ulamolar ham qatnashgan.','Mas’ud Kuhistoniy, “Abulxayrxon tarixi”'],rel:['ulugbek','abusaid','shayboniy']},
ulugbek:{n:'Mirzo Ulug‘bek',a:'U',y:'1394–1449',r:'Movarounnahr hukmdori, astronom',bg:['a','a'],f:[['Shahar','Samarqand'],['Soha','Astronomiya']],t:'Temuriy hukmdor va olim. Qizi Robiya Sulton begim Abulxayrxonga turmushga chiqqan. Uning fojiasidan so‘ng Abdullatif taxtga chiqdi, o‘ldirilgach esa Samarqandda Abdulloh Mirzo, Buxoroda Abu Said podshoh bo‘ldi.',l:['Samarqandda rasadxona va ilmiy maktab asos solgan.','Qizi orqali Abulxayrxon bilan qarindoshlik rishtalari bog‘langan.'],rel:['abulxayr','abusaid']},
abusaid:{n:'Abu Said Mirzo',a:'S',y:'1424–1469',r:'Temuriy hukmdor',bg:['a','d'],f:[['Nasl','Mironshoh nabirasi'],['Taxt','Buxoro, Samarqand, Hirot']],t:'Abdulloh Mirzo bilan kurashda g‘olib chiqdi. Abulxayrxon yordamida Samarqand taxtini egalladi va Movarounnahr hukmdoriga aylandi.',l:['1457-yil Abulqosim Bobur vafotidan so‘ng Hirotni egalladi, saltanatning ikki qismini birlashtirdi.','1469-yildan keyin davlat ikki mustaqil qismga bo‘lindi.','O‘g‘illari Sulton Ahmad, Mahmud va Ali Movarounnahrda hukmronlik qildi.'],rel:['abulxayr','husayn','bobur']},
husayn:{n:'Sulton Husayn Boyqaro',a:'H',y:'1438–1506',r:'Hirot hukmdori',bg:['c','d'],f:[['Nasl','Umarshayx Mirzo chevarasi'],['Poytaxt','Hirot']],t:'Avval Xorazmni egalladi, 1469-yil Hirot taxtini oldi. Natijada Temuriylar davlati ikki mustaqil qismga bo‘linib ketdi. Uning davrida Hirot madaniyat markazi bo‘lgan, Navoiy shu saroyda yashagan.',l:['Uning so‘nggi yillarida o‘g‘li Badiuzzamon bilan nizo kuchaydi.','Bu parokandalikdan Shayboniyxon foydalandi.'],rel:['bobur','shayboniy']},
bobur:{n:'Zahiriddin Muhammad Bobur',a:'B',y:'1483–1530',r:'Shoir, sarkarda, boburiylar sulolasi asoschisi',bg:['m','c'],f:[['Tug‘ilgan','14-fevral 1483, Andijon'],['Otasi','Umarshayx Mirzo'],['Onasi','Qutlug‘ Nigorxonim']],t:'12 yoshida Farg‘ona taxtiga o‘tirdi. Maqsadi Amir Temur saltanatini tiklash edi. Beklar bo‘ysunmadi, amakisi Sulton Ahmad va tog‘asi Mahmudxon hujum qildi. Samarqand uchun kurashda va keyingi mag‘lubiyatlarda ham mohir sarkarda sifatida tan olindi.',l:['1497 — 7 oylik qamaldan so‘ng Samarqandni oldi, ammo qo‘shin ochlik va sovuqdan tarqaldi, Andijon qo‘ldan ketdi.','1500 — Samarqandni yana oldi; 1501-yil aprel Saripulda Shayboniyxondan yengildi.','1504 — 200–300 navkar bilan Hisor tog‘lari orqali Afg‘onistonga o‘tib, G‘azna va Kobulni oldi.','1511 — Shoh Ismoil bilan ittifoq; 1512-noyabr G‘ijduvon jangida yengilib, Movarounnahrdan voz kechdi.','1526-yil aprel — Panipatda 12 ming kishilik qo‘shin bilan Ibrohim Lo‘diyning 100 minglik qo‘shinini yengib, Dehlini oldi.','Ijodi: 119 g‘azal, 209 ruboiy, tuyuq, qit’a, muammo, “Mubayyin”, “Boburnoma”. Navoiy bilan yozishgan.'],q:['Dushman na oldinga yurishga, na qochishga yo‘l topolmadi; tushgacha jang davom etib, dushman yakson bo‘ldi.','Bobur, “Boburnoma” (Panipat jangi)'],rel:['shayboniy','ismoil','husayn']},
shayboniy:{n:'Muhammad Shayboniyxon',a:'M',y:'1451–1510',r:'Shayboniylar davlati asoschisi',bg:['s','d'],f:[['Taxallus','Shohbaxt'],['Bobosi','Abulxayrxon'],['Halok bo‘ldi','1510, Marv']],t:'Otasi Shohbudog‘ Sulton erta vafot etgach, bobosi qaramog‘ida o‘sdi. 1468-yil o‘zbek ulusi qulagan bo‘lsa-da, 1480-yil bobosining davlatini tikladi. Temuriylar ichki nizolaridan foydalanib Movarounnahrga yurdi.',l:['1499 — Jizzax, Samarqand orqali Qarshi va Shahrisabzgacha bordi.','1500 — Sulton Ali Mirzo Samarqandni jangsiz topshirdi, Buxoro ham olindi.','1501 — Saripulda Boburni yengdi; 1503 — Sirdaryo bo‘yida Mahmudxon va Bobur qo‘shinini tor-mor qildi.','1505–1509 — Urganch, Balx, Hirot, Xuroson (Damg‘on, Astrobod, Mashhad).','Davlati Sirdaryodan Qandahorgacha, Xitoydan Kaspiygacha cho‘zildi.','Pul islohoti: bir xil og‘irlikdagi kumush (5,2 g) va mis tangalar; Zarafshonda suvtaqsimlagich qurdirdi.','1510 — Ismoil Safaviy bilan jangda halok bo‘ldi.'],rel:['abulxayr','bobur','ismoil','ubaydulla']},
ismoil:{n:'Shoh Ismoil Safaviy',a:'I',y:'1487–1524',r:'Eron hukmdori, safaviylar shohi',bg:['m','b'],f:[['G‘alaba','Marv, 1510']],t:'1510-yil Marv yaqinida Shayboniyxon qo‘shinini yengdi. 1511-yil Bobur u bilan ittifoq tuzib, Hisor, Buxoro va Samarqandni oldi; ammo mahalliy aholi shia mazhabidagi eroniylar bilan hamkorlikdan norozi bo‘ldi.',l:['Shayboniyxon o‘limi Movarounnahrdagi kuch muvozanatini o‘zgartirdi.'],rel:['shayboniy','bobur']},
ubaydulla:{n:'Ubaydullaxon',a:'O',y:'1486–1540',r:'Buxoro xoni',bg:['a','c'],f:[['Xon','1533 dan'],['Poytaxt','Buxoro']],t:'Shayboniy sarkardasi sifatida G‘ijduvonda Boburni yengdi. 1533-yildan davlatni boshqarib, ichki kelishmovchiliklarga barham berdi va Hirotni eronliklardan ikki marta tortib oldi.',l:['1533-yil poytaxtni Samarqanddan Buxoroga ko‘chirdi, davlat Buxoro xonligi deb atala boshladi.','Vafotidan so‘ng ikkihokimiyatchilik: Buxoroda Abdulazizxon, Samarqandda Ko‘chkunchixon o‘g‘illari.'],rel:['shayboniy','abdullaxon']},
abdullaxon:{n:'Abdullaxon II',a:'X',y:'1534–1598',r:'Shayboniylarning eng qudratli xoni',bg:['a','d'],f:[['Buxoroni oldi','1557'],['Vafot','1598'],['Taxallus','Xon']],t:'1557-yil Buxoroni egallab, Balx, Samarqand, Toshkent, Farg‘ona, Badaxshon, Xuroson va Xorazmni birlashtirdi, markazlashgan boshqaruvni tikladi. Vorislik otadan o‘g‘ilga o‘ta boshlagan, valiahdga Balx berilgan.',l:['Pul islohoti: oltin tanga, asosiy zarbxona Buxoroda.','Abdullaxon bandi (Oqchob, 1582), Tuyatortar, Hovuzixon, Afshona ariqlari, Puli Karmina, Puli Mehtar ko‘priklari.','1582 — Ulug‘tog‘ safari xotirasiga masjid qurdirdi.','Qo‘shin pilta miltiq va zambaraklar bilan qurollandi.','Iste’dodli shoir; davrida “Abdullanoma” va “Haft iqlim” yaratildi.','Vafotidan so‘ng o‘g‘li Abdulmo‘min 6 oy hukm surdi; Pir Muhammadxon II — so‘nggi shayboniy.'],q:['Buxoroda ko‘p masjid, rabot, ko‘prik va hovuzlar bunyod etilib, vaqf yerlar ajratildi.','Hofiz Tanish Buxoriy, “Abdullanoma”'],rel:['ubaydulla','tanish','jenkinson']},
tanish:{n:'Hofiz Tanish Buxoriy',a:'T',y:'XVI asr',r:'Tarixchi',bg:['a','b'],f:[['Asar','Abdullanoma, 1584–1589']],t:'“Abdullanoma” (“Sharafnomayi shohiy”) muallifi. Abdullaxon II davri qurilishlari va hayotini batafsil yozib qoldirgan.',l:['Shu davrda Amin Ahmad Roziyning “Haft iqlim” asari va Mutribiyning “Tazkirati shuaro”si ham yaratilgan.'],rel:['abdullaxon']},
jenkinson:{n:'Antoni Jenkinson',a:'J',y:'XVI asr',r:'Ingliz sayyohi va diplomat',bg:['s','c'],f:[['Safar','Buxoro, Xorazm']],t:'XVI asr o‘rtalarida Buxoroda bo‘lib, Amudaryo, Mang‘it ulusi, Xorazm va Buxoro xonligining ijtimoiy-siyosiy ahvoli hamda xalq turmushini yozib qoldirgan.',l:['Buxoroga har yili Hindiston, Eron, Balx va Rossiya savdogarlari yig‘ilishini qayd etgan.'],rel:['abdullaxon']}
};
const T=[['1428','Abulxayr Turada xon deb e’lon qilindi'],['1446','Abulxayr Sig‘noqni poytaxt qildi'],['1469','Husayn Boyqaro Hirot taxtida; Temuriylar davlati ikkiga bo‘lindi'],['1494','Bobur 12 yoshida Farg‘ona taxtiga o‘tirdi'],['1500–1501','Shayboniy Samarqandni oldi, Saripul jangi'],['1504','Bobur Kobulni egalladi'],['1507','Shayboniy Hirotni oldi'],['1510','Marv jangi: Shayboniy halok bo‘ldi'],['1512','G‘ijduvon jangi: Bobur Movarounnahrdan voz kechdi'],['1526','Panipat: boburiylar davlati asos solindi'],['1533','Poytaxt Buxoroga ko‘chdi'],['1557–1598','Abdullaxon II davri']];
const M=[['Davlat boshqaruvi','Xon oq kigizda ko‘tarilib taxtga o‘tirgan. Lavozimlar: naqib, otaliq, parvonachi, dodxoh, ko‘kaldosh, devonbegi, yasovul, mirshab, miroxur, qushbegi. Qozikalon, shayxulislom, muftiy, sadr, muhtasib shariat tartibini saqlagan.'],['Dehqonchilik','Qochgan dehqonlar qaytarilib, soliq imtiyozi berilgan. Zarafshon, Chirchiq, Sirdaryo, Amudaryo, Vaxsh, Murg‘ob suvlaridan foydalanilgan; yangi ariq, band va ko‘priklar qurilgan.'],['Hunarmandchilik','Samarqand hujjatlarida 60 dan ortiq hunar. To‘qimachilik (atlas, baxmal, kimxob), Samarqand qog‘ozi, kulolchilik, charm, kemasozlik, qurolsozlik.'],['Savdo','Buxoroga Hindiston, Eron, Balx, Rossiya savdogarlari kelgan. Hindistondan qimmatbaho toshlar, shakar, xina, shol; har hunarmandning alohida bozori bo‘lgan.'],['Pul va soliq','Ashrafiy (oltin), tanga, xoniy (kumush), mis dinor, pul. Soliqlar: xiroj, tanobona, ixroj, zakot (1/40), tog‘ar, oshlig‘; majburiy mehnat.']];
const $=document.getElementById('app'),bg=document.getElementById('bg');
function home(){
 bg.style.backgroundImage=scene('a','a');
 $.innerHTML='<section class="hero"><span class="tag">XV–XVI asrlar</span><h1>Turon tarixi: Temuriylardan Shayboniylargacha</h1><p style="max-width:620px;font-size:18px">Abulxayrxon, Bobur, Shayboniyxon va Abdullaxon II — Movarounnahr taqdirini hal qilgan shaxslar va voqealar.</p><div><a class="btn" href="#shaxslar">Shaxslar bilan tanishish</a></div></section>'
 +'<h2>Xronologiya</h2><div class="card tl">'+T.map(x=>'<div><b>'+x[0]+'</b> — '+x[1]+'</div>').join('')+'</div>'
 +'<h2 id="shaxslar">Tarixiy shaxslar</h2><div class="grid">'+Object.keys(P).map(k=>'<a class="card pc" href="#'+k+'"><div class="av">'+P[k].a+'</div><b>'+P[k].n+'</b><small>'+P[k].y+'</small><div style="font-size:14px;opacity:.85">'+P[k].r+'</div></a>').join('')+'</div>'
 +'<h2 id="mavzular">Mavzular</h2><div class="grid">'+M.map(m=>'<div class="card"><h3 style="margin-top:0">'+m[0]+'</h3><p style="font-size:15px;margin:0">'+m[1]+'</p></div>').join('')+'</div>';
}
function person(k){
 const p=P[k],ks=Object.keys(P),i=ks.indexOf(k),pv=ks[(i+ks.length-1)%ks.length],nx=ks[(i+1)%ks.length];
 bg.style.backgroundImage=scene(p.bg[0]=='m'?'m':p.bg[0],p.bg[1]);
 $.innerHTML='<div style="padding-top:20px"><a class="chip" href="#home">← Bosh sahifa</a></div><div class="card" style="margin-top:14px"><div class="av">'+p.a+'</div><span class="tag">'+p.y+'</span><h1 style="font-size:clamp(28px,5vw,46px)">'+p.n+'</h1><p style="color:var(--gold);margin-top:0">'+p.r+'</p><div class="facts">'+p.f.map(f=>'<div><small>'+f[0]+'</small>'+f[1]+'</div>').join('')+'</div><p>'+p.t+'</p><h3>Muhim voqealar</h3><ul>'+p.l.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+(p.q?'<div class="q">‘'+p.q[0]+'’<span>— '+p.q[1]+'</span></div>':'')+'<h3>Bog‘liq shaxslar</h3>'+p.rel.map(r=>'<a class="chip" href="#'+r+'">'+P[r].n+'</a>').join('')+'</div><div class="pn"><a class="chip" href="#'+pv+'">← '+P[pv].n+'</a><a class="chip" href="#'+nx+'">'+P[nx].n+' →</a></div>';
}
function route(){
 const h=location.hash.slice(1);
 if(P[h])person(h);else{home();if(h=='shaxslar'||h=='mavzular'){const e=document.getElementById(h);if(e)e.scrollIntoView()}else window.scrollTo(0,0)}
 if(P[h])window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script></body></html>
